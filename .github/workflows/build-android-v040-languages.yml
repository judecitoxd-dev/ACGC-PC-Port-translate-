name: Build Android v0.4 Languages

on:
  push:
    branches:
      - build/android-v0.4-languages-20260805
    paths:
      - ".github/workflows/build-android-v040-languages.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact Android v0.4 language patch
        shell: bash
        run: |
          cat .build/patchpart_* | base64 --decode > "$RUNNER_TEMP/android.patch.gz"
          gzip -dc "$RUNNER_TEMP/android.patch.gz" > "$RUNNER_TEMP/android.patch"
          git apply --check "$RUNNER_TEMP/android.patch"
          git apply "$RUNNER_TEMP/android.patch"
          rm -rf .build

      - name: Restore SDL2
        run: |
          rm -rf android/SDL
          git clone --depth 1 --branch release-2.30.11 \
            https://github.com/libsdl-org/SDL.git android/SDL

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build 32-bit APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          CHECK_DIR="$RUNNER_TEMP/apk-check"
          mkdir -p "$CHECK_DIR"
          unzip -q "$APK" "lib/*" -d "$CHECK_DIR"
          test -f "$CHECK_DIR/lib/armeabi-v7a/libmain.so"
          UNEXPECTED_ABIS="$(find "$CHECK_DIR/lib" -mindepth 1 -maxdepth 1 -type d ! -name armeabi-v7a -print)"
          test -z "$UNEXPECTED_ABIS"
          readelf -h "$CHECK_DIR/lib/armeabi-v7a/libmain.so" | grep -Eq 'Class:[[:space:]]+ELF32'
          readelf -h "$CHECK_DIR/lib/armeabi-v7a/libmain.so" | grep -Eq 'Machine:[[:space:]]+ARM'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"
          cp "$APK" ACGC-Android-32bit-v0.4.0-Languages.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ACGC-Android-32bit-v0.4.0-Languages
          path: ACGC-Android-32bit-v0.4.0-Languages.apk
          if-no-files-found: error
