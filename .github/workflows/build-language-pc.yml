name: Build PC custom languages

on:
  push:
    branches:
      - pc-custom-languages
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win32:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-SDL2
            mingw-w64-i686-make
            python
            file
            zip
      - name: Validate Multi6 source and tools
        shell: msys2 {0}
        run: |
          python -m py_compile tools/msg_tool.py tools/language_pack.py tools/pal_multi5_import.py
          grep -q 'pc_language_expand_custom_control' pc/src/pc_language.c
          grep -q 'languages/%s/items' pc/src/pc_language.c
          grep -q 'languages/%s/font/FONT_nes_tex_font1.bin' pc/src/pc_language.c
          grep -q 'Turkish has no grammatical gender' pc/src/pc_language.c
          grep -q 'Turkce' pc/src/pc_settings_menu.c
          grep -q 'CHAR_BREVE_g' include/m_font.h
          ! find languages -type f \( -name '*.bin' -o -name '*.arc' -o -name '*.szs' \) -print -quit | grep -q .
      - name: Build native Win32 port
        shell: msys2 {0}
        run: ./build_pc.sh
      - name: Verify Win32 executable
        shell: msys2 {0}
        run: |
          EXE=pc/build32/bin/AnimalCrossing.exe
          test -f "$EXE"
          file "$EXE" | grep -qi 'PE32 executable'
          test -f pc/build32/bin/SDL2.dll
          test -s "$EXE"
      - name: Package test build
        shell: msys2 {0}
        run: |
          mkdir -p pc/build32/bin/languages
          cp languages/README.md pc/build32/bin/languages/
          cp docs/LANGUAGES_ES.md pc/build32/bin/
          cp docs/LANGUAGES_TR.md pc/build32/bin/
          cd pc/build32/bin
          zip -q -r "$GITHUB_WORKSPACE/Animal-Crossing-PC-Multi6-Turkish-Win32-base.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: Animal-Crossing-PC-Multi6-Turkish-Win32-base
          path: Animal-Crossing-PC-Multi6-Turkish-Win32-base.zip
          if-no-files-found: error
          retention-days: 7
