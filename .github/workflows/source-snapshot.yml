name: Source snapshot

on:
  push:
    branches:
      - pc-custom-languages
    paths:
      - ".github/workflows/source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Package source
        run: |
          rm -rf .git
          zip -q -r ACGC-PC-custom-languages-source.zip . -x 'ACGC-PC-custom-languages-source.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: ACGC-PC-custom-languages-source
          path: ACGC-PC-custom-languages-source.zip
          if-no-files-found: error
          retention-days: 7
